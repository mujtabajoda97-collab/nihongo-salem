name: Keep backend awake

# The free Render plan stops a service after 15 idle minutes and takes about a
# minute to wake it, which made calls time out. A ping every 10 minutes avoids
# that. Switching the Render service to the Starter plan makes this unnecessary:
# then delete this file.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      API_BASE_URL: ${{ vars.API_BASE_URL || 'https://japanese-backend-cn68.onrender.com' }}
    steps:
      - name: Ping /health
        run: curl -fsS --max-time 90 --retry 2 --retry-delay 5 "$API_BASE_URL/health"
