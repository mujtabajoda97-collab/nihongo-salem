name: Generate lesson audio

# Generates the ~890 lesson clips (dialogue lines + vocabulary) with OpenAI TTS,
# commits them to assets/audio and then rebuilds the APK so the audio is bundled
# in the app (no waiting, works offline).
# Needs ONE repository secret: OPENAI_API_KEY (Settings > Secrets and variables > Actions).
# Safe to re-run: files that already exist are skipped, so a failed run resumes where it stopped.
on:
  workflow_dispatch:
    inputs:
      episodes:
        description: 'Episodes to generate, e.g. 1-2 to test first (empty = all 40)'
        required: false
        default: ''

permissions:
  contents: write
  actions: write

jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check the secret exists
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error title=OPENAI_API_KEY missing::Add the repository secret OPENAI_API_KEY (Settings > Secrets and variables > Actions > New repository secret), then run this workflow again."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate audio
        working-directory: backend
        run: |
          EPS="${{ github.event.inputs.episodes }}"
          ARGS="--episodes-dir ../assets/data/episodes --out-dir ../assets/audio --concurrency 4"
          if [ -n "$EPS" ]; then ARGS="$ARGS --episodes $EPS"; fi
          node generate_episodes_media.js --dry-run $ARGS
          node generate_episodes_media.js $ARGS

      - name: Commit the audio files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/audio
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
          else
            echo "Added $(git diff --cached --name-only | wc -l) audio files"
            git commit -m "Add generated lesson audio"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Rebuild the APK with the audio inside
        run: gh workflow run build_apk.yml --ref main
